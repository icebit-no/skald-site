name: Build

# On every pull request and push to main: builds the site and runs its checks (npm test, then npm run build, which
# fails when a page lacks its other language, has an inline script or style the content security policy would
# refuse, loads anything from another host, or links to a page or fragment that is not built), and builds the image
# and serves it once the way svalbard runs it. GitHub's own runners: the repository is public.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --no-audit --no-fund
      - run: npm test
      # «Sagaen» reads Skald's releases; the job's token raises GitHub's limit for that request.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

  image:
    name: Build and serve the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: skald-site:ci
      CONTAINER: skald-site-ci
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Never pushed; svalbard is linux/amd64 like the runner.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          secrets: |
            github_token=${{ github.token }}

      # Runs the image as svalbard does (unprivileged, read-only, no capabilities) and asks its nginx, which listens
      # on the container's own loopback, from inside the container.
      - name: Serve and check
        run: |
          docker run --detach --name "$CONTAINER" --read-only --tmpfs /tmp --cap-drop=all \
            --security-opt=no-new-privileges "$IMAGE" > /dev/null
          get() { docker exec "$CONTAINER" wget -q -S -O /dev/null "http://127.0.0.1:3107$1" 2>&1; }

          deadline=$((SECONDS + 60))
          until get / > /dev/null || [ "$SECONDS" -ge "$deadline" ]; do
            sleep 1
          done

          failed=0
          if [ "$(docker exec "$CONTAINER" id -u)" = "0" ]; then
            echo "::error::nginx runs as root."
            failed=1
          fi
          for page in / /nb /icon-32.png /robots.txt; do
            if ! get "$page" > /dev/null; then
              echo "::error::$page did not answer 200."
              failed=1
            fi
          done
          for page in / /nb; do
            if ! get "$page" | grep -q "Content-Security-Policy: default-src 'none'"; then
              echo "::error::$page has no content security policy."
              failed=1
            fi
          done
          if ! get /nb/ | grep -q "301 Moved Permanently"; then
            echo "::error::/nb/ is not sent to /nb."
            failed=1
          fi
          if get /finst-ikkje > /dev/null; then
            echo "::error::An unknown address answered 200, not 404."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            docker logs "$CONTAINER"
            exit 1
          fi
          echo "The image serves every page from a read-only, unprivileged container."

      - name: Clean up
        if: always()
        run: docker rm --force "$CONTAINER" > /dev/null 2>&1 || true
