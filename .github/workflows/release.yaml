name: Release

# Publishes the site's image to ghcr.io when a GitHub release is published. svalbard's app-sync runs the image of
# the repository's latest release (pre-releases and drafts do not count) and restarts the site with it.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/skald-site
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.title=skald-site
            org.opencontainers.image.description=The site of Skald, Norwegian push-to-talk dictation
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      # «Sagaen» is read from Skald's releases while the image builds, so the site shows the releases there are now.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
