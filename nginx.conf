# Serves the built site on svalbard behind Caddy, which terminates TLS for skald.icebit.app and sends its requests
# here. After solveig-site's (https://github.com/icebit-no/solveig-site, MIT). Runs as an unprivileged user on a
# read-only file system: everything nginx writes goes to /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
# Requests are in Caddy's log for the host; the container's own output carries only nginx's own failures.
error_log stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log off;
    log_not_found off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Cloudflare does not compress what is marked no-transform, so the pages leave here compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Built assets carry a hash in their names. Pages are asked again each time, and no-transform keeps Cloudflare
    # from rewriting them: its e-mail obfuscation would add a script the policy below refuses.
    map $uri $cache_control {
        ~^/_astro/ "public, max-age=31536000, immutable";
        default "no-cache, no-transform";
    }

    server {
        listen 127.0.0.1:3107;
        server_name _;
        root /usr/share/nginx/html;

        # Redirects keep the host and scheme the browser used: Caddy and Cloudflare are in front. Slashes are merged
        # before a location is matched, so no redirect below can start with // and lead to another host.
        absolute_redirect off;
        merge_slashes on;

        # Every header is set here, at the server level: an add_header inside a location would drop them all. The
        # site runs only its own files and asks nothing of any host once it is loaded.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control $cache_control always;

        error_page 404 /404.html;

        # Addresses have no trailing slash, so one with a slash is sent to the address without it.
        location ~ ^(.+)/$ {
            return 301 $1;
        }

        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri.html =404;
        }
    }
}
